<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HESBAH DRIVER | تسجيل الدخول</title><link rel="stylesheet" href="/styles.css"></head><body><main class="driver-login-page"><section class="driver-login-card"><div class="driver-login-brand">HESBAH <span>DRIVER</span></div><div class="driver-login-bike">🏍️</div><h1>تسجيل دخول مندوب التوصيل</h1><p>سجّل دخولك للوصول إلى طلباتك ومهام التوصيل.</p><form id="loginForm"><input id="username" class="input" placeholder="اسم المستخدم" autocomplete="username" required><input id="password" class="input" type="password" placeholder="كلمة المرور" autocomplete="current-password" required><button class="btn" type="submit">دخول إلى مركز التوصيل</button></form><div id="error" class="driver-login-error"></div></section></main><script>document.getElementById("loginForm").addEventListener("submit",async function(e){e.preventDefault();var er=document.getElementById("error");er.textContent="جاري تسجيل الدخول...";try{var r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value.trim(),password:document.getElementById("password").value})});var d=await r.json();if(!r.ok)throw new Error(d.message||"بيانات الدخول غير صحيحة");if(d.user?.role!=="driver")throw new Error("هذا الحساب ليس حساب مندوب توصيل.");localStorage.hesbahToken=d.token;localStorage.hesbahUser=JSON.stringify(d.user);location.replace("/driver.html?v="+Date.now())}catch(e){er.textContent=e.message}})</script></body></html>
