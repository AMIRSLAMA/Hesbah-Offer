<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hesbah Offer | Driver</title><link rel="stylesheet" href="/styles.css"></head><body class="driver-page"><header class="top role-top"><div><div class="logo">HESBAH <span>DRIVER</span></div><small>مركز تشغيل مندوب التوصيل</small></div><div class="driver-head-actions"><span id="driver-status-pill" class="driver-status-pill online">● متاح</span><button id="driverAvailabilityBtn" type="button" class="btn light">تغيير الحالة</button><button id="driverLogoutBtn" type="button" class="btn">خروج</button></div></header><main class="container"><section class="role-hero driver-hero"><div><span class="role-badge">🏍️ مندوب التوصيل</span><h1>كل طلب في إيدك من الاستلام حتى باب العميل</h1><p>تابع الطلبات المسندة، حدّث الحالة، وشارك موقعك مع العميل أثناء التوصيل.</p><div class="driver-quick-stats"><div><b id="driver-active-count">0</b><span>طلبات نشطة</span></div><div><b id="driver-done-count">0</b><span>تم التسليم</span></div><div><b id="driver-gps-mini">ON</b><span>GPS</span></div></div></div><div class="role-icon">🏍️</div></section><div id="driver-gps-status" class="gps-panel">📍 GPS: في انتظار وجود طلب توصيل نشط</div><section class="driver-toolbar"><button class="driver-filter active" onclick="setDriverFilter(this)">الطلبات النشطة</button><button class="driver-filter" onclick="setDriverFilter(this)">سجل التسليمات</button><button class="driver-filter" onclick="loadOrders()">تحديث ↻</button></section><section class="order-section"><div class="section-title"><div><h2>مهامي الآن</h2><p>الطلبات المسندة إليك فقط.</p></div></div><section id="orders" class="role-orders"></section></section></main><script src="/panel.js?v=20261009-sessionfix"></script><script>async function refreshDriverAvailability(){try{var r=await fetch("/api/drivers/me",{headers:{Authorization:"Bearer "+(localStorage.hesbahToken||"")}}),d=await r.json();if(!r.ok)throw new Error(d.message||"تعذر قراءة الحالة");var on=d.driver.status==="available";var p=document.getElementById("driver-status-pill");if(p){p.className="driver-status-pill "+(on?"online":"offline");p.textContent=on?"● متاح":"● غير متاح"}var g=document.getElementById("driver-gps-mini");if(g)g.textContent=on?"ON":"OFF";var b=document.getElementById("driverAvailabilityBtn");if(b)b.textContent=on?"غير متاح":"متاح"}catch(e){console.error(e)}}async function toggleDriverAvailability(){try{var r0=await fetch("/api/drivers/me",{headers:{Authorization:"Bearer "+(localStorage.hesbahToken||"")}}),d0=await r0.json();var next=d0.driver.status==="available"?"unavailable":"available";var r=await fetch("/api/drivers/me/status",{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(localStorage.hesbahToken||"")},body:JSON.stringify({status:next})}),d=await r.json();if(!r.ok)throw new Error(d.message||"تعذر تغيير الحالة");await refreshDriverAvailability()}catch(e){alert(e.message)}}function setDriverFilter(b){document.querySelectorAll(".driver-filter").forEach(function(x){x.classList.remove("active")});b.classList.add("active");localStorage.setItem("hesbahDriverView",b.textContent.includes("سجل")?"history":"active");loadOrders()}document.addEventListener("DOMContentLoaded",function(){if(localStorage.getItem("hesbahDriverAvailable")===null)localStorage.setItem("hesbahDriverAvailable","1");refreshDriverAvailability();var a=document.getElementById("driverAvailabilityBtn");var x=document.getElementById("driverLogoutBtn");if(a)a.addEventListener("click",toggleDriverAvailability);if(x)x.addEventListener("click",driverLogout)});function driverLogout(){localStorage.removeItem("hesbahToken");localStorage.removeItem("hesbahUser");localStorage.removeItem("hesbahDriverAvailable");window.location.href="/driver-login.html?logout=1&v="+Date.now()}</script></body></html>
