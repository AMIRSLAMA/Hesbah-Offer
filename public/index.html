<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hesbah Offer</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><div class="logo">HESBAH <span>OFFER</span></div><div class="row"><button class="btn light" onclick="show('#ordersModal')">📦 طلباتي</button><button class="btn light" onclick="show('#cartModal')">🛒 السلة</button><button id="accountBtn" class="btn" onclick="accountAction()">دخول</button></div></header><main class="container"><section class="hero"><div><div class="pill">اطلبها. نجيبها.</div><h1>اختيارات أذكى.<br>عروض أقوى.</h1><p>منصة Hesbah Offer للطلب من المتاجر القريبة والتوصيل حتى باب البيت.</p><div class="search"><input id="q" class="input" placeholder="دور على متجر أو منتج..."><button class="btn" onclick="searchProducts()">بحث</button></div></div><div style="font-size:100px;text-align:center">🛍️</div></section><div class="row" style="margin-top:30px"><h2>متاجر قريبة</h2><span class="muted">متاجر مختارة وعروض يومية</span></div><section id="stores" class="grid"></section></main>
<div id="loginModal" class="modal"><div class="modalbox"><h2>تسجيل الدخول</h2><input id="username" class="input" placeholder="اسم المستخدم"><br><br><input id="password" type="password" class="input" placeholder="كلمة المرور"><br><br><button class="btn" style="width:100%" onclick="login()">دخول</button><p class="muted">عميل جديد؟ <button onclick="hide('#loginModal');show('#registerModal')">إنشاء حساب</button></p></div></div>
<div id="registerModal" class="modal"><div class="modalbox"><h2>حساب عميل جديد</h2><input id="rname" class="input" placeholder="الاسم"><br><br><input id="rphone" class="input" placeholder="رقم الهاتف"><br><br><input id="ruser" class="input" placeholder="اسم المستخدم"><br><br><input id="rpass" type="password" class="input" placeholder="كلمة المرور"><br><br><button class="btn" style="width:100%" onclick="register()">إنشاء الحساب</button></div></div>
<div id="storeModal" class="modal"><div class="modalbox"><div class="row"><h2 id="storeTitle"></h2><button onclick="hide('#storeModal')">✕</button></div><div id="products" class="grid"></div></div></div>
<div id="cartModal" class="modal"><div class="modalbox"><div class="row"><h2>السلة</h2><button onclick="hide('#cartModal')">✕</button></div><div id="cart"></div><h3>الإجمالي: <span id="cartTotal">0</span></h3><textarea id="address" class="input" placeholder="عنوان التوصيل"></textarea><br><br><select id="payment" class="input"><option value="cash">الدفع عند الاستلام</option><option value="card">دفع إلكتروني</option></select><br><br><input id="coupon" class="input" placeholder="كود الخصم"><br><br><button class="btn" style="width:100%" onclick="checkout()">تأكيد الطلب</button></div></div>
<div id="ordersModal" class="modal"><div class="modalbox"><div class="row"><h2>طلباتي</h2><button onclick="hide('#ordersModal')">✕</button></div><div id="myOrders"></div></div></div>
<script>function searchProducts(){const q=document.querySelector('#q').value.trim();if(q)location.href='/search.html?q='+encodeURIComponent(q)}function show(x){document.querySelector(x).classList.add('show')}function hide(x){document.querySelector(x).classList.remove('show')}function accountAction(){localStorage.hesbahToken?logout():show('#loginModal')}</script><script src="/app.js"></script></body></html>
