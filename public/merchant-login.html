<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hesbah Offer | Merchant Login</title><link rel="stylesheet" href="/styles.css"></head><body class="driver-login-page"><main class="driver-login-page"><section class="driver-login-card"><div class="driver-login-brand">HESBAH <span>MERCHANT</span></div><div class="driver-login-bike">🏪</div><h1>تسجيل دخول التاجر</h1><p>أدخل بيانات حساب التاجر للوصول إلى لوحة التحكم.</p><form id="loginForm"><input id="username" class="input" placeholder="اسم المستخدم" autocomplete="username" required><input id="password" class="input" type="password" placeholder="كلمة المرور" autocomplete="current-password" required><button class="btn" type="submit">دخول إلى لوحة التاجر</button></form><div id="error" class="driver-login-error"></div></section></main><script>(function(){localStorage.removeItem('hesbahToken');localStorage.removeItem('hesbahUser');localStorage.removeItem('hesbahDriverAvailable');document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();const err=document.getElementById('error');err.textContent='جاري تسجيل الدخول...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.message||'بيانات الدخول غير صحيحة');if(d.user?.role!=='merchant')throw new Error('هذا الحساب ليس حساب تاجر.');localStorage.hesbahToken=d.token;localStorage.hesbahUser=JSON.stringify(d.user);location.href='/merchant.html'}catch(e){err.textContent=e.message}})})()</script></body></html>
