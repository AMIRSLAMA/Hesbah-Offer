<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hesbah Offer | Merchant</title><link rel="stylesheet" href="/styles.css"></head><body class="merchant-page"><header class="top role-top"><div><div class="logo">HESBAH <span>MERCHANT</span></div><small>إدارة وتشغيل متجرك</small></div><button class="btn" onclick="logout()">خروج</button></header><main class="container"><section class="role-hero merchant-hero"><div><span class="role-badge">🏪 لوحة التاجر</span><h1>إدارة الطلبات من لحظة وصولها حتى التسليم</h1><p>اقبل الطلب، جهزه، ثم اختر المندوب المناسب.</p></div><div class="role-icon">🏪</div></section><div class="merchant-nav"><button class="active" onclick="loadOrders()">📦 الطلبات</button><button onclick="loadMerchantProducts()">🛍️ المنتجات</button><button onclick="loadMerchantStore()">🏪 المتجر</button><button onclick="loadFinance()">💰 الحساب</button></div><section id="merchantStats" class="merchant-stats"></section><div class="merchant-filters"><button class="active" onclick="setMerchantFilter(this,'all')">الكل</button><button onclick="setMerchantFilter(this,'pending')">🔔 جديدة</button><button onclick="setMerchantFilter(this,'active')">⚙️ قيد التنفيذ</button><button onclick="setMerchantFilter(this,'done')">✅ مكتملة</button></div><section class="order-section"><div class="section-title"><div><h2>الطلبات الحالية</h2><p>كل طلب يظهر بحالته الحالية وخط سيره.</p></div></div><section id="orders" class="role-orders"></section></section></main><script src="/panel.js?v=20261008"></script><script>function setMerchantFilter(b,status){document.querySelectorAll(".merchant-filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector("#merchantFilter").dataset.status=status;loadOrders()}</script><div id="merchantFilter" data-status="all" hidden></div></body></html>
